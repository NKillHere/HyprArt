source = $HOME/.config/hypr/HyprArt/visuals/cache/colors.conf

general = {
    grace = 5
    hide_cursor = true
}

background = {
    monitor =
    path = $HOME/hypr/HyprArt/wallpapers
    color = rgba(0,0,0,255)
    blur_passes = 3
}

input-field = {
    monitor =
    size = 200, 50
    dots_size = 0.33
    dots_center = true
    dots_rounding = -1
    dots_spacing = 0.15

}